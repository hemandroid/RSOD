name: incident_sdk
description: Captures production Flutter failures with full context and ships them to an incident backend.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  cryptography: ^2.9.0
  # Hardware model only. Resolved once in the background at init and cached
  # (see DeviceCollector) — never touched on the crash path.
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.2.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
